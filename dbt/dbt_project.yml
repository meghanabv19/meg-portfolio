name: "meg_portfolio"
version: "26.7.0"
config-version: 2

profile: "meg_portfolio"

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  meg_portfolio:
    staging:
      +schema: staging
      +materialized: view
    mart:
      +schema: mart
      +materialized: table
      # After each mart table is (re)built, restore the read grants + RLS the
      # site's anon key depends on (dropping/recreating a table drops these).
      # Note: schema-level `grant usage on schema mart` lives in schema.sql (it
      # survives table rebuilds); running it per-model under parallel threads
      # causes "tuple concurrently updated" on the shared catalog row.
      +post-hook:
        - 'grant select on {{ this }} to anon, authenticated'
        - 'alter table {{ this }} enable row level security'
        - 'drop policy if exists "anon read" on {{ this }}'
        - 'create policy "anon read" on {{ this }} for select to anon, authenticated using (true)'
