version: 2

models:
  - name: mart_spotify_now_playing
    description: "Single latest played/now-playing track."
    columns:
      - name: track_name
        tests: [not_null]
      - name: artist_name
        tests: [not_null]
      - name: synced_at
        tests: [not_null]

  - name: mart_spotify_top_tracks
    description: "Ranked top tracks per term."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [term, rank]
    columns:
      - name: track_name
        tests: [not_null]
      - name: term
        tests:
          - accepted_values:
              values: ["short_term", "medium_term", "long_term"]

  - name: mart_spotify_top_artists
    description: "Ranked top artists per term."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [term, rank]
    columns:
      - name: artist_name
        tests: [not_null]

  - name: mart_strava_recent
    description: "Recent Strava activities."
    columns:
      - name: activity_id
        tests: [not_null, unique]
      - name: type
        tests:
          - accepted_values:
              values: ["Run", "Ride", "Walk", "Hike", "Swim", "Workout", "WeightTraining", "Yoga"]
      - name: distance_km
        tests: [not_null]

  - name: mart_strava_stats
    description: "Weekly / monthly rollups."
    columns:
      - name: period
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ["week", "month"]

  - name: mart_leetcode_summary
    description: "Latest LeetCode snapshot."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [username, synced_at]
    columns:
      - name: total_solved
        tests: [not_null]
      - name: username
        tests: [not_null]

  - name: mart_hackerrank_summary
    description: "One HackerRank summary row per user."
    columns:
      - name: username
        tests: [not_null, unique]
      - name: total_stars
        tests: [not_null]

  - name: mart_hackerrank_badges
    description: "HackerRank badges, one row per (user, badge)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [username, badge_name]
    columns:
      - name: badge_name
        tests: [not_null]
      - name: stars
        tests: [not_null]

  - name: mart_github_summary
    description: "One GitHub summary row per user."
    columns:
      - name: username
        tests: [not_null, unique]
      - name: public_repos
        tests: [not_null]

  - name: mart_github_repos
    description: "Non-fork repos, newest push first."
    columns:
      - name: name
        tests: [not_null, unique]

  - name: mart_tourist_places
    description: "Deduped tourist places for the map."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [place_name, lat, lng]
    columns:
      - name: lat
        tests: [not_null]
      - name: lng
        tests: [not_null]
      - name: first_visited
        tests: [not_null]
      - name: category
        tests:
          - accepted_values:
              values: ["TOURIST_ATTRACTION", "MUSEUM", "PARK", "LANDMARK"]
